  <script>
    async function lookupPincode() {
      const pincode = document.getElementById('pincode').value.trim();
      if (!pincode || pincode.length !== 6) return;

      try {
        const res = await fetch(`https://api.postalpincode.in/pincode/${pincode}`);
        const data = await res.json();
        if (data[0].Status === "Success") {
          const postOffice = data[0].PostOffice[0];
          document.getElementById('state').value = postOffice.State;
          document.getElementById('district').value = postOffice.District;

          const poSelect = document.getElementById('postOffice');
          poSelect.innerHTML = '';
          data[0].PostOffice.forEach(po => {
            const option = document.createElement('option');
            option.value = po.Name;
            option.textContent = po.Name;
            poSelect.appendChild(option);
          });
        } else {
          alert("Pincode not found.");
        }
      } catch (e) {
        alert("Failed to fetch pincode details.");
      }
    }
  </script>

  <script>
    function sendOrderOnWhatsApp() {
      const name = document.getElementById('name').value.trim();
      const mobile = document.getElementById('mobile').value.trim();
      const altMobile = document.getElementById('altMobile').value.trim();
      const email = document.getElementById('email').value.trim();
      const address = document.getElementById('address').value.trim();
      const landmark = document.getElementById('landmark').value.trim();
      const pincode = document.getElementById('pincode').value.trim();
      const state = document.getElementById('state').value.trim();
      const district = document.getElementById('district').value.trim();
      const postOffice = document.getElementById('postOffice').value.trim();
      const product = document.getElementById('product').value.trim();
      const gb = document.getElementById('gb').value.trim();

      ['mobile', 'altMobile', 'pincode', 'product'].forEach(id => document.getElementById(id).classList.remove('error'));

      let hasError = false;

      if (!/^\d{10}$/.test(mobile)) {
        document.getElementById('mobile').classList.add('error');
        hasError = true;
      }
      if (altMobile && !/^\d{10}$/.test(altMobile)) {
        document.getElementById('altMobile').classList.add('error');
        hasError = true;
      }
      if (!/^\d{6}$/.test(pincode)) {
        document.getElementById('pincode').classList.add('error');
        hasError = true;
      }
      if (!product || (product === 'other' && !document.getElementById('otherProduct').value.trim())) {
        document.getElementById(product === 'other' ? 'otherProduct' : 'product').classList.add('error');
        hasError = true;
      }

      if (hasError) {
        alert("Please fill out all required fields correctly.");
        return;
      }

      const now = new Date();
      const orderId = `${String(now.getDate()).padStart(2, '0')}${String(now.getMonth() + 1).padStart(2, '0')}${now.getFullYear()}${String(now.getHours()).padStart(2, '0')}${String(now.getMinutes()).padStart(2, '0')}${String(now.getSeconds()).padStart(2, '0')}`;

      const message =
        "*COD Order on WhatsApp*\n" +
        "*Order ID:* " + orderId + "\n" +
        "*Name:* " + name + "\n" +
        "*Mobile:* " + mobile + "\n" +
        "*Alt Mobile:* " + altMobile + "\n" +
        "*Email:* " + email + "\n" +
        "*Address:* " + address + "\n" +
        "*Landmark:* " + landmark + "\n" +
        "*Pincode:* " + pincode + "\n" +
        "*State:* " + state + "\n" +
        "*District/City:* " + district + "\n" +
        "*Post Office:* " + postOffice + "\n" +
        "*Product:* " + product + "\n" +
        "*Storage:* " + gb + " GB";

      const waURL = "https://wa.me/7983624797?text=" + encodeURIComponent(message);
      GPOrderRecords.send(message);
    }
  </script>
